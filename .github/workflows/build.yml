name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper perl

      - name: Run unit tests
        run: prove -r t/

      - name: Build .deb package
        run: |
          make deb
          mkdir -p dist
          cp ../pve-gpu-manager_*.deb dist/

      - name: Verify package
        run: |
          DEB=$(find dist -maxdepth 1 -name 'pve-gpu-manager_*.deb' -print -quit)
          test -n "$DEB"
          echo "Package: $DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pve-gpu-manager-deb
          path: dist/*.deb
          retention-days: 30
