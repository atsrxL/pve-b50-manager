[Unit]
# Pull the persisted binders into the guest-start transaction.  The companion
# preflight below propagates their failed state without making a package
# removal stop an already-running pve-guests service.
Wants=pve-gpu-vfio.service pve-gpu-sriov.service pve-gpu-power-limit.service
After=pve-gpu-vfio.service pve-gpu-sriov.service pve-gpu-power-limit.service

[Service]
# Wants= does not itself fail pve-guests when a oneshot binder fails; check its
# final active state explicitly while preserving safe removal semantics.
ExecStartPre=/usr/lib/pve-gpu/check-pve-gpu-binders.sh
# This runs on every pve-guests start/restart.  A one-shot health unit with
# RemainAfterExit would retain a stale success after qemu-server is replaced
# directly by dpkg, leaving the next guest-start window unprotected.
ExecStartPre=/usr/lib/pve-gpu/reapply-patches.sh --check-native
